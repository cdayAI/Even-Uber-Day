name: Build Even Hub Display

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'even-hub-display/**'
      - '.github/workflows/display-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'even-hub-display/**'
  workflow_dispatch:

concurrency:
  group: display-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: even-hub-display

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: even-hub-display/package-lock.json

      # Installs exactly what package-lock.json records. A fresh `npm install`
      # crashes npm 10's resolver on vitest's optional-peer cycle, so the
      # lockfile was resolved with npm 11 — regenerate it the same way.
      - name: Install dependencies
        run: npm ci

      - name: Type-check app and server
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build
